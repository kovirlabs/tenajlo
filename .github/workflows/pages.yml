# Publishes the website to https://kovirlabs.github.io/tenajlo/: site/ (the landing page) plus
# guide/, rendered from docs/user-guide.md by scripts/build-site.mjs.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/user-guide.md"
      - "scripts/build-site.mjs"
      - "scripts/guide-template.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
