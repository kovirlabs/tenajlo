<!doctype html>
<!-- Source of site/assets/social-card.png (1280x640), rendered by scripts/screenshots.mjs.
     Used for link previews (Open Graph) and as the GitHub repository's social preview. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: #2b3a4a;
        color: #e8edf2;
        display: grid;
        grid-template-columns: 470px 1fr;
        align-items: center;
      }
      .text {
        padding: 0 0 0 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 56px;
        font-weight: 800;
      }
      .brand img {
        width: 84px;
        height: 84px;
        border-radius: 18px;
        box-shadow: 0 0 0 2px rgb(255 255 255 / 15%);
      }
      p {
        font-size: 30px;
        line-height: 1.3;
        margin: 28px 0 0;
      }
      .accent {
        color: #f08a3c;
      }
      .shot {
        margin-left: 40px;
        width: 900px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgb(0 0 0 / 45%);
      }
      .shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="brand"><img src="../site/assets/icon.svg" alt="" />Tenajlo</div>
      <p>A desktop Git client for <span class="accent">Forgejo</span>.</p>
      <p>Clone, commit, push and branch, without the command line.</p>
    </div>
    <div class="shot"><img src="../site/assets/screenshots/changes.png" alt="" /></div>
  </body>
</html>
