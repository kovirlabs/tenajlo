[package]
name = "tenajlo-askpass"
version = "0.1.0"
description = "Askpass trampoline for Tenajlo: forwards git prompts to the app over loopback"
edition.workspace = true
license.workspace = true

[lib]
name = "tenajlo_askpass"
path = "src/lib.rs"

[[bin]]
name = "tenajlo-askpass"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
