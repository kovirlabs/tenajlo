# A Forgejo server on your own computer for trying Tenajlo by hand (see README.md here).
# Unlike dev/forgejo.yml (the throwaway server for the automated tests), it keeps its data
# between restarts, uses secrets generated by setup.ps1 / setup.sh, and listens on different
# ports so both can run at once.
#
#   Web and HTTPS remotes: http://localhost:3001
#   SSH remotes:           ssh://git@localhost:2223/<owner>/<repo>.git
#
# Loopback only: nothing outside this computer can reach it.
name: tenajlo-test-server

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    restart: unless-stopped
    # SECRET_KEY, INTERNAL_TOKEN, JWT secrets: generated once by the setup script.
    env_file: .env
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__server__ROOT_URL=http://localhost:3001/
      - FORGEJO__server__SSH_DOMAIN=localhost
      - FORGEJO__server__SSH_PORT=2223
      - FORGEJO__server__LFS_START_SERVER=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
    volumes:
      - forgejo-data:/data
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:2223:22"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  forgejo-data:
