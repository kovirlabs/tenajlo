# Throwaway Forgejo for `cargo test --features integration` (spec §11).
#
#   docker compose -f dev/forgejo.yml up -d
#   dev/seed-forgejo.sh
#   cd src-tauri && cargo test --features integration
#
# Listens on loopback only. Data lives in the container and is discarded with it.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__server__ROOT_URL=http://localhost:3000/
      - FORGEJO__service__DISABLE_REGISTRATION=true
    ports:
      - "127.0.0.1:3000:3000"
