[package]
name = "tenajlo"
version = "0.1.0"
description = "Desktop Git client for self-hosted Forgejo"
edition.workspace = true
license.workspace = true
publish = false
default-run = "tenajlo"

[lib]
name = "tenajlo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
# Dev tool only; gated so `tauri build` doesn't bundle it into the app.
required-features = ["bindings"]

[features]
bindings = []
# Tests against a real Forgejo: docker compose -f dev/forgejo.yml up -d && dev/seed-forgejo.sh
integration = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread", "io-util", "sync", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
dunce = "1"
tauri-plugin-dialog = "2.8"
uuid = { version = "1", features = ["v4", "serde"] }
notify-debouncer-full = "0.7.0"
trash = "5.2.9"
getrandom = "0.4"
tenajlo-askpass = { version = "0.1.0", path = "../crates/askpass" }
keyring = "4.2"
tauri-plugin-opener = "2.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "system-proxy"] }
tracing-appender = "0.2.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
