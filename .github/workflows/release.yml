# Builds the installers for a version tag (e.g. v1.0.0) and attaches them to a draft GitHub
# Release for review: Windows NSIS, Linux .deb and macOS (Apple Silicon) .dmg. See
# docs/releasing.md. Installers are not code-signed. When the TAURI_SIGNING_PRIVATE_KEY secret
# is set, every build also signs its update package (NSIS installer, macOS .app.tar.gz, .deb)
# and the release gets the latest.json feed that installed copies check.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # One job creates the draft so the build jobs don't race to create it (drafts can't be
  # looked up by tag, so each would make its own).
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version" >&2
            exit 1
          fi
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Take the id from the create call itself: a new draft doesn't show up in the release
        # list straight away.
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -F draft=true \
            -f name="Tenajlo $GITHUB_REF_NAME" \
            -f body="See docs/user-guide.md for what's new and how to install." \
            --jq .id)
          if [ -z "$id" ]; then
            echo "Creating the draft release returned no id" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 22.04's older glibc lets the .deb run on Debian 12+ as well as Ubuntu 22.04+.
          - os: ubuntu-22.04
            bundles: deb
          - os: macos-latest # Apple Silicon (arm64)
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: pnpm install --frozen-lockfile
      # Update packages need the signing key; without the secret, builds are as before.
      - name: Choose bundles and update signing
        id: bundle
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          args="--bundles ${{ matrix.bundles }}"
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
            if [ -z "$pubkey" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY is set but tauri.conf.json has no updater pubkey" >&2
              exit 1
            fi
            # macOS updates replace the .app, so build it alongside the .dmg.
            if [ "$RUNNER_OS" = "macOS" ]; then args="--bundles app,dmg"; fi
            args="$args --config src-tauri/tauri.updater.conf.json"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      # Runs `pnpm tauri build`; beforeBuildCommand (tauri.<platform>.conf.json) builds
      # tenajlo-askpass, generates THIRD_PARTY_LICENSES.html and, on Windows, fetches the
      # pinned, checksum-verified MinGit + git-lfs.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: ${{ steps.bundle.outputs.args }}
      - name: Attach the license list to the release
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/resources/THIRD_PARTY_LICENSES.html --clobber
