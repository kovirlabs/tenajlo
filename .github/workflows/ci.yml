# Checks every push and pull request (spec §11). Windows is the P0 platform, so the Rust
# suite runs there too: it's the only place cfg(windows) code is compiled and tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries for Tauri
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev git-lfs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # tauri-build copies the askpass sidecar from src-tauri/binaries over the test binary
      # in target/; build the real one first (as `pnpm tauri dev` does).
      - run: node scripts/build-askpass.mjs
        working-directory: .
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Tests need git >= 2.40 and git-lfs on PATH (preinstalled on GitHub's images).
      - run: cargo test --workspace

  licenses:
    # Every shipped Rust crate and npm package must have an accepted license (about.toml).
    # Also runs on Windows because the release build runs this script there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/third-party-licenses.mjs --out target/THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: third-party-licenses
          path: target/THIRD_PARTY_LICENSES.html

  integration:
    # Forgejo in Docker (dev/forgejo.yml): HTTPS/SSH auth, clone, push, merge, LFS.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries for Tauri
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev git-lfs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: node scripts/build-askpass.mjs
        working-directory: .
      - name: Start Forgejo
        working-directory: .
        run: |
          docker compose -f dev/forgejo.yml up -d
          until curl -sf http://localhost:3000/api/v1/version; do sleep 1; done
          dev/seed-forgejo.sh
      - run: cargo test --features integration
      - name: Forgejo logs
        if: failure()
        working-directory: .
        run: docker compose -f dev/forgejo.yml logs --tail 200
