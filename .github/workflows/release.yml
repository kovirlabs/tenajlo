# Builds the Windows installer for a version tag (e.g. v1.0.0) and attaches it to a draft
# GitHub Release for review. See docs/releasing.md. Builds are unsigned for now.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version" >&2
            exit 1
          fi
      # Runs `pnpm tauri build`; beforeBuildCommand builds tenajlo-askpass, fetches the pinned,
      # checksum-verified MinGit + git-lfs, and generates THIRD_PARTY_LICENSES.html.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tenajlo ${{ github.ref_name }}
          releaseBody: See docs/user-guide.md for what's new and how to install.
          releaseDraft: true
          args: --bundles nsis
      - name: Attach the license list to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/resources/THIRD_PARTY_LICENSES.html --clobber
